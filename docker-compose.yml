# Local development services. Start with `docker compose up -d --wait`.
#
# Everything belongs to the "sparks" project (containers, volume, network), and
# ports are published on 127.0.0.1 only, so nothing is reachable from the
# local network.
name: sparks

services:
  sql:
    # SQL Server 2025, Developer edition. The image is x64-only; on Apple
    # Silicon, Docker Desktop runs it through Rosetta.
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is not set. Run scripts/setup-dev.sh first.}"
    ports:
      - "127.0.0.1:14332:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    # SQL Server refuses to start with less than 2 GB.
    mem_limit: 2g
    healthcheck:
      # $$ leaves the variable for the container's shell, so the password
      # never appears in the container's configuration.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\""]
      # The first start builds the system databases on a new volume, which can
      # take a few minutes under emulation; later starts take about 30 seconds.
      start_period: 5m
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql-data:
