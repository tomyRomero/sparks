name: CI

on:
  push:
    branches: [main, upgrade]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Some clients are created when their module loads, so the build needs
      # values in these variables. These are dummies, not credentials.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          OPENAI_API_KEY: ci-placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci-placeholder
          NEXT_PUBLIC_PUSHER_APP_KEY: ci-placeholder
          NEXT_PUBLIC_PUSHER_CLUSTER: us2

  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore sparks.slnx

      # Warnings are errors (src/backend/Directory.Build.props).
      - name: Build
        run: dotnet build sparks.slnx --no-restore --configuration Release

      - name: Format
        run: dotnet format sparks.slnx --verify-no-changes --no-restore

      - name: Tests
        run: dotnet test --solution sparks.slnx --no-build --configuration Release
